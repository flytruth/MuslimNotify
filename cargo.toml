[workspace]
resolver = "2"
members = ["crates/mn-core", "crates/mn-ffi", "crates/mn-cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/muslimnotify/muslimnotify"
authors = ["MuslimNotify contributors"]

[profile.release]
opt-level = 3
lto = true
strip = true

[profile.dev]
opt-level = 1
